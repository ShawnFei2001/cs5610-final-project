[
build
]
  # Path to the frontend directory (modify this to match your structure)
  base = "kambaz-react-web-app/"
  
  # The directory to publish (output by your build)
  publish = "dist/"  # For Vite projects (use "build/" for Create React App)
  
  # Build command
  command = "npm run build"

# Set proper MIME types
[[
headers
]]
  for = "/*.js"
  [
headers.values
]
    Content-Type = "application/javascript"

[[
headers
]]
  for = "/*.mjs"
  [
headers.values
]
    Content-Type = "application/javascript"
    
[[
headers
]]
  for = "/*.tsx"
  [
headers.values
]
    Content-Type = "application/javascript"
    
[[
headers
]]
  for = "/*.jsx"
  [
headers.values
]
    Content-Type = "application/javascript"